name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Create Project Structure
      run: |
        mkdir -p app/src/main/java/com/smartphoneai/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml

    - name: Create AndroidManifest.xml
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.smartphoneai.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_gallery"
                android:label="SmartPhone AI"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create MainActivity.kt
      run: |
        cat > app/src/main/java/com/smartphoneai/app/MainActivity.kt << 'EOF'
        package com.smartphoneai.app

        import android.app.Activity
        import android.content.Intent
        import android.content.IntentSender
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.CheckBox
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.IntentSenderRequest
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File

        class MainActivity : AppCompatActivity() {

            private lateinit var statusText: TextView
            private lateinit var pickButton: Button
            private lateinit var driveButton: Button
            private lateinit var deleteButton: Button
            private lateinit var confirmCheckBox: CheckBox

            private val selectedFiles = mutableListOf<Uri>()

            private val pickMedia = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                if (result.resultCode == Activity.RESULT_OK) {
                    val data: Intent? = result.data
                    val clipData = data?.clipData
                    if (clipData != null) {
                        for (i in 0 until clipData.itemCount) {
                            selectedFiles.add(clipData.getItemAt(i).uri)
                        }
                    } else {
                        val uri: Uri? = data?.data
                        if (uri != null) {
                            selectedFiles.add(uri)
                        }
                    }
                    statusText.text = "${selectedFiles.size} فایل انتخاب شد."
                    pickButton.text = "تغییر انتخاب‌ها (${selectedFiles.size})"
                } else {
                    if (selectedFiles.isEmpty()) {
                        statusText.text = "هنوز عکسی یا فیلمی انتخاب نشده."
                    }
                }
            }

            private val deleteRequest = registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->
                if (result.resultCode == Activity.RESULT_OK) {
                    statusText.text = "فایل‌ها با موفقیت حذف شدند."
                    selectedFiles.clear()
                    pickButton.text = "۱) انتخاب عکس‌ها و فیلم‌ها"
                    confirmCheckBox.isChecked = false
                    Toast.makeText(this, "حذف انجام شد!", Toast.LENGTH_LONG).show()
                } else {
                    Toast.makeText(this, "حذف لغو شد.", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                statusText = findViewById(R.id.statusText)
                pickButton = findViewById(R.id.pickButton)
                driveButton = findViewById(R.id.driveButton)
                deleteButton = findViewById(R.id.deleteButton)
                confirmCheckBox = findViewById(R.id.confirmCheckBox)

                pickButton.setOnClickListener {
                    val intent = Intent(Intent.ACTION_PICK)
                    intent.type = "*/*"
                    intent.putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                    intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                    pickMedia.launch(intent)
                }

                driveButton.setOnClickListener {
                    if (selectedFiles.isEmpty()) {
                        Toast.makeText(this, "اول باید فایل انتخاب کنید!", Toast.LENGTH_SHORT).show()
                        return@setOnClickListener
                    }
                    val shareIntent = Intent(Intent.ACTION_SEND_MULTIPLE)
                    shareIntent.type = "*/*"
                    shareIntent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(selectedFiles))
                    startActivity(Intent.createChooser(shareIntent, "ارسال به گوگل درایو"))
                }

                deleteButton.setOnClickListener {
                    if (selectedFiles.isEmpty()) {
                        Toast.makeText(this, "فایلی برای حذف وجود ندارد!", Toast.LENGTH_SHORT).show()
                        return@setOnClickListener
                    }
                    if (!confirmCheckBox.isChecked) {
                        Toast.makeText(this, "لطفاً تیک تایید را بزنید.", Toast.LENGTH_SHORT).show()
                        return@setOnClickListener
                    }
                    requestDeletePermission()
                }
            }

            private fun requestDeletePermission() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    val uris = ArrayList(selectedFiles)
                    val pendingIntent = MediaStore.createDeleteRequest(contentResolver, uris)
                    deleteRequest.launch(IntentSenderRequest.Builder(pendingIntent.intentSender).build())
                } else {
                    var deletedCount = 0
                    for (uri in selectedFiles) {
                        try {
                            val file = File(uri.path!!)
                            if (file.exists()) {
                                file.delete()
                            }
                            deletedCount++
                        } catch (e: Exception) {
                            e.printStackTrace()
                        }
                    }
                    statusText.text = "$deletedCount فایل (عکس یا فیلم) از گوشی حذف شد."
                    selectedFiles.clear()
                    pickButton.text = "۱) انتخاب عکس‌ها و فیلم‌ها"
                    confirmCheckBox.isChecked = false
                    Toast.makeText(this, "حذف انجام شد!", Toast.LENGTH_LONG).show()
                }
            }
        }
        EOF

    - name: Create activity_main.xml
      run: |
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center_horizontal"
            android:padding="24dp"
            android:layoutDirection="rtl">

            <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="SmartPhone AI"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_marginBottom="32dp"
                android:layout_gravity="center" />

            <TextView
                android:id="@+id/statusText"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="هنوز عکسی یا فیلمی انتخاب نشده."
                android:textSize="16sp"
                android:layout_marginBottom="24dp" />

            <Button
                android:id="@+id/pickButton"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="۱) انتخاب عکس‌ها و فیلم‌ها"
                android:layout_marginBottom="16dp" />

            <Button
                android:id="@+id/driveButton"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="۲) ارسال به GOOGLE DRIVE"
                android:layout_marginBottom="24dp" />

            <CheckBox
                android:id="@+id/confirmCheckBox"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="داخل Drive نگاه کردم و همه‌ی عکس‌ها آپلود شده‌اند."
                android:layout_marginBottom="16dp" />

            <Button
                android:id="@+id/deleteButton"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="۳) حذف این عکس‌ها و فیلم‌ها از گوشی" />

        </LinearLayout>
        EOF

    - name: Create strings.xml
      run: |
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">SmartPhone AI</string>
        </resources>
        EOF

    - name: Create build.gradle (app)
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.smartphoneai.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.smartphoneai.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Create build.gradle (root)
      run: |
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SmartPhoneAI"
        include ':app'
        EOF

    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartPhoneAI-APK
        path: app/build/outputs/apk/debug/app-debug.apk
